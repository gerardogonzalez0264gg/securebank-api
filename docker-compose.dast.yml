# Entorno efímero para DAST (Sesión 8). Se crea y se destruye en cada ejecución.
#   export JWT_SECRET=$(openssl rand -base64 48) SEED_ALICE_PW=$(openssl rand -hex 12) SEED_BOB_PW=$(openssl rand -hex 12)
#   docker compose -f docker-compose.dast.yml up -d --build
#   curl http://localhost:8080/health
#   docker compose -f docker-compose.dast.yml down -v
services:
  securebank:
    build:
      context: .
      dockerfile: docker/Dockerfile.v2   # imagen endurecida (no root, tini, sin setuptools)
    ports:
      - "8080:8000"                      # 8080 (host) -> 8000 (gunicorn)
    environment:
      JWT_SECRET: ${JWT_SECRET:?defínelo con openssl rand -base64 48}
      DATABASE_URL: sqlite:////data/securebank.db
      SECUREBANK_DB: /data/securebank.db
      SEED_ALICE_PW: ${SEED_ALICE_PW:?defínelo en tu shell}
      SEED_BOB_PW: ${SEED_BOB_PW:?defínelo en tu shell}
      PYTHONPATH: /app
    volumes:
      - ./lab:/app/lab:ro                # seed de datos de prueba (solo lectura)
    tmpfs:
      - /data:uid=10001,mode=0700        # BD efímera: desaparece con el contenedor
      - /tmp:uid=10001,mode=1777         # gunicorn necesita /tmp para workers (read_only fix)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - sh
      - -c
      - python lab/dast/seed.py "$$SECUREBANK_DB" && exec gunicorn --bind 0.0.0.0:8000 --worker-tmp-dir /dev/shm src.app:app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
