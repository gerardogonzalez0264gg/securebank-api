name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Mínimo privilegio: el workflow solo puede leer el repo
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Escanear secretos (falla si encuentra alguno)
        run: |
          gitleaks detect --source . --config .gitleaks.toml \
            --redact --verbose --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  # Etapas siguientes del pipeline (se agregan cuando existan):
  # sast:
  #   needs: secret-scan   # Semgrep
  # sca:
  #   needs: sast          # Trivy
