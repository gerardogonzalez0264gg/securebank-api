name: SecurePipeline CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

# Mínimo privilegio: el workflow solo puede leer el repo
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Escanear secretos (falla si encuentra alguno)
        run: |
          gitleaks detect --source . --config .gitleaks.toml \
            --redact --verbose --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  build:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m pytest || [ $? -eq 5 ]
        env:
          PYTHONPATH: .

  sast:
    name: SAST Scan (Semgrep)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          python3 -m pip install semgrep
          semgrep --config=p/owasp-top-ten --error --sarif --output=sast.sarif src/
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast.sarif

  package:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Empaquetado simulado del artefacto"