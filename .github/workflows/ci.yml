name: SecurePipeline CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m pytest || [ $? -eq 5 ]
        env:
          PYTHONPATH: .

  sast:
    name: SAST Scan (Semgrep)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          python3 -m pip install semgrep
          semgrep --config=p/owasp-top-ten --error --sarif --output=sast.sarif src/
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast.sarif

  package:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Empaquetado simulado del artefacto"