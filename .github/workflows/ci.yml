
name: SecureBank API - CI v1.0

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

# Mínimo privilegio: el workflow solo puede leer el repo
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Escanear secretos (falla si encuentra alguno)
        run: |
          gitleaks detect --source . --config .gitleaks.toml \
            --redact --verbose --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  build:
    needs: secret-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  dast:
    name: DAST (OWASP ZAP Baseline)
    needs: build
    runs-on: ubuntu-latest
    env:
      ZAP_IMAGE: zaproxy/zap-stable:2.16.1   # versión fija (R.06)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Tests de seguridad (BOLA y headers)
        run: |
          pip install -r requirements.txt
          python -m pytest tests/security -q

      - name: Generar secretos efímeros del entorno de test
        run: |
          for var in JWT_SECRET SEED_ALICE_PW SEED_BOB_PW; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            echo "${var}=${value}" >> "$GITHUB_ENV"
          done

      - name: Levantar SecureBank (contenedor efímero)
        run: |
          docker compose -f docker-compose.dast.yml up -d --build --wait --wait-timeout 300
          curl -sf http://localhost:8080/health

      - name: ZAP Baseline Scan
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network=host -v "$PWD/zap-out:/zap/wrk/:rw" \
            "$ZAP_IMAGE" zap-baseline.py \
            -t http://localhost:8080 \
            -r report.html -J report.json -w report.md -I

      - name: Guardar reportes DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report-${{ github.sha }}
          path: zap-out/
          retention-days: 14
          if-no-files-found: warn

      - name: Destruir entorno de test
        if: always()
        run: docker compose -f docker-compose.dast.yml down -v

  sast:
    name: SAST (Semgrep)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Semgrep (no falla por hallazgos: decide el gate)"
        run: |
          pip install semgrep==1.180.0
          semgrep scan --config p/default --metrics=off --sarif --output sast.sarif src

      # Alternativa literal de la diapositiva de la Sesión 5 (comentada: el gate de S9 ya bloquea
      # Critical/High en código propio). Descomentar si se quiere que este job falle por sí solo.
      # - name: Semgrep OWASP Top 10 (falla con hallazgos)
      #   run: semgrep scan --config p/owasp-top-ten --error --metrics=off src

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast.sarif
          if-no-files-found: warn

  sca:
    name: SCA (Trivy)
    needs: secret-scan
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: "0.69.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Trivy (checksum verificado)
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "${base}/${file}" -o "${file}"
          curl -sSfL "${base}/trivy_${TRIVY_VERSION}_checksums.txt" -o checksums.txt
          grep " ${file}$" checksums.txt | sha256sum -c -
          tar -xzf "${file}" trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: "Escanear dependencias (no falla por hallazgos: decide el gate)"
        run: trivy fs --scanners vuln --skip-dirs reports,docs,material-curso --format json --output sca.json .

      # ── Entregables de la Sesión 6 (comentados, no se ejecutan) ──
      # Generan desde el pipeline los archivos que hoy están en reports/ (creados a mano
      # el 2026-11-25 con pip-audit + cyclonedx-py, ver reports/README.md).
      # - name: SBOM CycloneDX 1.5 (reports/securebank-sbom.cdx.json)
      #   run: |
      #     mkdir -p reports
      #     trivy fs --format cyclonedx --output reports/securebank-sbom.cdx.json .
      #
      # - name: Reporte de vulnerabilidades (reports/securebank-vulns.html + .json)
      #   run: |
      #     pip install pip-audit==2.10.1
      #     pip-audit -r requirements.txt -f json -o reports/securebank-vulns.json || true
      #     trivy fs --scanners vuln --format template \
      #       --template "@contrib/html.tpl" --output reports/securebank-vulns.html .
      #
      # - name: Semáforo CVSS (CVSS >= 9 bloquea el job)
      #   run: |
      #     trivy fs --scanners vuln --severity CRITICAL --exit-code 1 .
      #
      # - name: Guardar entregables S6
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: s6-reports-${{ github.sha }}
      #     path: reports/

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: sca.json
          if-no-files-found: warn

  coverage:
    name: Cobertura de tests
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Tests unitarios, de seguridad y del consolidador
        run: |
          pip install -r requirements.txt
          python -m pytest tests --cov=src --cov-report=json:coverage.json --cov-report=term

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json
          if-no-files-found: warn

  gate:
    name: Security Gate (OPA)
    # always(): el gate debe decidir aunque un scanner haya fallado (falla cerrada)
    if: ${{ always() }}
    needs: [secret-scan, sast, sca, coverage, dast]
    runs-on: ubuntu-latest
    env:
      OPA_VERSION: "1.9.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar reportes de los scanners
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Catálogo CISA KEV (exploitability real)
        run: |
          curl -sSfL --retry 3 \
            "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json" \
            -o kev.json

      - name: Instalar OPA (checksum verificado)
        run: |
          base="https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}"
          curl -sSfL "${base}/opa_linux_amd64_static" -o opa
          curl -sSfL "${base}/opa_linux_amd64_static.sha256" -o opa.sha256
          echo "$(cut -d' ' -f1 opa.sha256)  opa" | sha256sum -c -
          chmod +x opa && sudo mv opa /usr/local/bin/opa
          opa version

      - name: Consolidar hallazgos en findings.json
        run: |
          python scripts/consolidate_findings.py \
            --gitleaks reports/gitleaks-report/gitleaks.sarif \
            --sast reports/sast-report/sast.sarif \
            --sca reports/sca-report/sca.json \
            --dast reports/dast-report-${{ github.sha }}/report.json \
            --coverage reports/coverage-report/coverage.json \
            --context config/security-context.json \
            --kev kev.json \
            --commit "${{ github.sha }}" --branch "${{ github.ref_name }}" \
            --build "${{ github.run_number }}" \
            -o findings.json

      - name: Evaluar política (BLOCK -> exit 1)
        run: scripts/gate.sh findings.json gate-result.json

      - name: Guardar evidencia del gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ github.sha }}
          path: |
            findings.json
            gate-result.json
          retention-days: 90
