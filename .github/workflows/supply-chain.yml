name: sesion13-supply-chain
on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

env:
  reg: ghcr.io
  repoimg: ${{ github.repository }}/securebank

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: bajar codigo
        uses: actions/checkout@v4

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.reg }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build y push
        id: mipush
        uses: docker/build-push-action@v5
        with:
          context: .
          # Imagen real de SecureBank (endurecida en S10). Antes: docker/Dockerfile.s13 (alpine + echo de prueba).
          file: docker/Dockerfile.v2
          push: true
          # :v1 lo pide la rúbrica de S13; el tag con el SHA del commit no se sobrescribe y da trazabilidad.
          tags: |
            ${{ env.reg }}/${{ env.repoimg }}:v1
            ${{ env.reg }}/${{ env.repoimg }}:${{ github.sha }}

      - name: guardar digest
        run: |
          echo "Digest: ${{ steps.mipush.outputs.digest }}"
          echo "DIGREF=${{ env.reg }}/${{ env.repoimg }}@${{ steps.mipush.outputs.digest }}" >> $GITHUB_ENV

      - name: traer syft
        uses: anchore/sbom-action/download-syft@v0

      - name: generar sbom
        run: |
          syft ${{ env.DIGREF }} -o cyclonedx-json > sbom.json
          echo "componentes:"
          jq '.components | length' sbom.json

      - name: subir sbom
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: instalar cosign
        uses: sigstore/cosign-installer@v3

      - name: firmar y attest
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign ${{ env.DIGREF }}
          cosign attest --predicate sbom.json --type cyclonedx ${{ env.DIGREF }}

      - name: verificar firma
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.DIGREF }} || exit 1

      # Evidencia de Rekor (comentado): imprime la entrada del transparency log para el reporte de S13.
      # - name: evidencia rekor
      #   run: |
      #     cosign verify --output json \
      #       --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/.*" \
      #       --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #       ${{ env.DIGREF }} | jq '.[0].optional.Bundle.Payload.logIndex'
      #     echo "Buscar en https://search.sigstore.dev/?logIndex=<logIndex>"

